plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.demoweather'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.example.demoweather"
        minSdk 27
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material

    // Networking & Image Loading theo tai lieu DemoWeatherAPI.pdf
    implementation libs.volley   // com.android.volley:volley:1.2.1
    implementation libs.picasso  // com.squareup.picasso:picasso:2.8

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}

